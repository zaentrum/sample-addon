apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The platform namespace. Change it; nothing else in this overlay knows it.
namespace: zaentrum
# The addons marker, stamped by kustomize rather than by hand per file. The
# portal's operator console groups workloads by it: platform services in one
# section, ADDONS in their own. Forget it and your addon renders as
# "unclaimed" — something nobody owns.
#
# includeSelectors stays at its default of false on purpose: a Deployment's
# selector is immutable, so adding to it would make a re-apply fail.
labels:
  - pairs:
      app.kubernetes.io/part-of: zaentrum-addons
resources:
  - sample-addon.yaml
