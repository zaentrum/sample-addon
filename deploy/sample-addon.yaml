# The whole install unit of the reference addon: one Deployment, one Service.
# No Ingress, no Route — the portal's proxy is the addon's front door, and the
# console is served by the addon's own binary. No Secret — the addon holds no
# credentials; the platform pulls its manifest when an admin installs it.
#
# Things you must supply (see deploy/README.md):
#   - OIDC_ISSUER for your instance (only the authenticated endpoint needs it)
#   - hostAliases if your cluster cannot resolve the public hostname from
#     inside (the platform's own services do the same — check one of them)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-addon
  labels: { app: sample-addon }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sample-addon }
  template:
    metadata:
      labels: { app: sample-addon }
    spec:
      containers:
        - name: sample-addon
          image: ghcr.io/zaentrum/sample-addon:latest
          imagePullPolicy: Always
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: ADDON_KEY,   value: "sample" }
            - { name: OIDC_ISSUER, value: "https://media.example.org/auth/realms/zaentrum" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: sample-addon
  labels: { app: sample-addon }
spec:
  selector: { app: sample-addon }
  ports:
    - { name: http, port: 80, targetPort: http }
