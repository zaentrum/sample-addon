name: image
on:
  push:
    branches: [main]
    # A release: the tag vX.Y.Z publishes the image as :vX.Y.Z and :X.Y.
    tags: ['v*.*.*']
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
# One image build at a time per ref: two in-flight builds race for :latest,
# and the OLDER commit can win.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main publishes :latest. A release tag publishes :vX.Y.Z and :X.Y (no
      # :X.Y for a pre-release such as v1.2.0-rc.1), and leaves :latest where
      # main put it: a release build that finishes after a newer push to main,
      # or a tag on an older commit, must not move everyone back.
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="ghcr.io/zaentrum/sample-addon:${GITHUB_REF_NAME}"
            case "${GITHUB_REF_NAME}" in
              *-*) ;;
              *) v="${GITHUB_REF_NAME#v}"; tags="${tags},ghcr.io/zaentrum/sample-addon:${v%.*}" ;;
            esac
            echo "tags=${tags}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/zaentrum/sample-addon:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
