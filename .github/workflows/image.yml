name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
# One image build at a time per ref: two in-flight builds race for :latest,
# and the OLDER commit can win.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tags=ghcr.io/zaentrum/sample-addon:latest,ghcr.io/zaentrum/sample-addon:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/zaentrum/sample-addon:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
