name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  # The organisation's shared neutrality check.
  neutrality:
    permissions:
      contents: read
    uses: zaentrum/.github/.github/workflows/neutrality.yml@v1
    with:
      exceptions: |
        .github/workflows/ci.yml  holds the older neutrality check until the shared check replaces it

  # A fresh checkout builds without node: go:embed finds the placeholder that
  # the console's build fills later. The tests need the console; `test` builds
  # it first.
  fresh-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go build ./...
      - run: go vet ./...
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      # A build leaves the checkout as it was: what it writes is ignored, and the
      # placeholder a fresh checkout's go:embed needs stays.
      - name: the build leaves the checkout unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # The reference addon must be as neutral as the platform: no internal
      # hostnames, no acquisition tooling. Patterns are split so this file
      # never trips itself.
      - name: neutrality gate
        run: |
          H="$(printf '%s' 'nalet' '\.' 'cloud')|$(printf '%s' 'implentic' '\.' 'com')"
          T="$(printf '%s' 'nzb' 'get')|$(printf '%s' 'qbit' 'torrent')|$(printf '%s' 'son' 'arr')|$(printf '%s' 'rad' 'arr')|$(printf '%s' 'prow' 'larr')"
          ! grep -rniE "$H|\b($T)\b" --include="*.go" --include="*.md" --include="*.ts" --include="*.tsx" --include="*.yaml" --include="*.yml" . \
            || { echo "::error::internal hostname or acquisition tool name in the reference addon"; exit 1; }
      - name: container build (sanity)
        run: docker build -t sample-addon:ci .
